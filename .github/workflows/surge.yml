name: Deploy to Surge

# 1. on détermine l'évènement qui lancera le workflow
on:
  # … au push sur la branche `S19E03-surge`
  push: ["S19E03-surge"]
  # … permet le déclenchement manuel
  workflow_dispatch:

# Définition des permissions nécessaires
permissions:
  # Permission de lire le contenu du dépôt
  # (nécessaire pour le processus de checkout du code, comme dans l'étape actions/checkout@v4)
  contents: read
  # Permet de créer un token
  # (peut être nécessaire pour interagir avec d'autres services ou APIs externes pour prouver l'identité du workflow ; ex. : Google Cloud, authentification OAuth…)
  id-token: write

jobs:
  # Besoins
  #   Node
  #   PNPM
  #   Surge (global)
  #   Token surge (dans les secrets)
  #   Build le projet
  #
  # Commande
  # surge ./dist https://orecipes-gilgamesh.surge.sh --token ${{ secrets.SURGE_TOKEN }}
  
  # Tâche pour le build ET le déploiement du projet
  build_and_deploy:
    # Type du runner : la tâche s'exécute sur un Ubuntu
    runs-on: ubuntu-latest
    # Variables d'environnement
    env:
      # Variables d'environnement
      # (voir Settings > Secrets and Variables)
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    # Étapes de la tâche
    steps:
      # Récupère le code du dépôt (copie notre code dans le runner Ubuntu → git checkout S19E02-gh-pages)
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      # Prépare l'environnement Node
      - name: ⚙️ Setup de l'environnement Node.js
        uses: actions/setup-node@v4
        # with:
          # node-version: 22

      - name: ❤️ Utilisation de PNPM et installation des dépendances
        uses: pnpm/action-setup@v4
        with:
          run_install: true

      # Lancement des tests
      - name: 🧪 Lancement des tests
        run: pnpm test || echo "⚠️ Pas de test trouvé mais le déploiement continue…"

      # Installation de Biome (via l'action officielle)
      # → https://biomejs.dev/recipes/continuous-integration
      - name: 🚀 Installer Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest
      
      # Vérification du code avec Biome
      - name: 🎨 Exécuter Biome pour formater et analyser le code
        run: biome ci .
        # run: biome check --apply # permet d'appliquer la correction au lieu de bloquer le déploiement

      # Build du projet
      - name: 🏗️ Build du projet
        run: pnpm build

      # Installation de Surge
      - name: Installer Surge
        run: pnpm install --global surge

      # Déploiement
      # (https://thecodersblog.com/deploying-static-website-surge-github-actions)
      # (https://dev.to/usamasubhani/deploy-react-apps-on-surge-using-github-actions-free-2h7i)
      # (https://github.com/yavisht/deploy-via-surge.sh-github-action-template)
      - name: Déploiement
        run: surge ./dist ${{ vars.SURGE_DOMAIN }} --token ${{ secrets.SURGE_TOKEN }}